name: CI

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}

defaults:
  run:
    shell: bash

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  RUSTFLAGS: --deny warnings

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust Toolchain
      run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

    - uses: Swatinem/rust-cache@v2.9.2

    - name: Clippy
      run: cargo clippy --workspace --all-targets

    - name: Format
      run: cargo fmt --all -- --check

    - name: Install rumdl
      run: |
        curl --fail --location --silent --show-error \
          https://github.com/rvben/rumdl/releases/download/v0.3.0/rumdl-v0.3.0-x86_64-unknown-linux-gnu.tar.gz \
          | tar --extract --gzip --directory /usr/local/bin

    - name: Lint Markdown
      run: rumdl check

    - name: Check for Forbidden Words
      run: |
        sudo apt-get install ripgrep
        ./bin/forbid

  book:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust Toolchain
      run: rustup toolchain install stable --profile minimal

    - uses: Swatinem/rust-cache@v2.9.2

    - name: Install mdBook
      run: |
        curl --fail --location --silent --show-error \
          https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
          | tar --extract --gzip --directory /usr/local/bin

    - name: Install mdbook-linkcheck2
      run: cargo install mdbook-linkcheck2 --locked --version 0.13.0

    - name: Generate
      run: cargo run --package generate

    - name: Build Book
      run: mdbook build book

  features:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust Toolchain
      run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown

    - uses: Swatinem/rust-cache@v2.9.2

    - name: Check Without Default Features
      run: cargo check --lib --bins --no-default-features

    - name: Check With Only Filesystem Feature
      run: cargo check --lib --bins --no-default-features --features fs

    - name: Check WASM Without Default Features
      run: cargo check --lib --bins --no-default-features --target wasm32-unknown-unknown

    - name: Check Library-Only Dependencies
      run: |
        ! cargo tree \
          --edges normal \
          --format '{p}' \
          --no-default-features \
          --package filepack \
          --prefix none \
          | grep -E '^(clap|clap_complete|clap_mangen|dirs|indicatif|rust-embed|tempfile|tracing-subscriber|walkdir) '

  test:
    strategy:
      matrix:
        os:
        - macos-latest
        - ubuntu-latest
        - windows-latest

    runs-on: ${{matrix.os}}

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust Toolchain
      run: rustup toolchain install stable --profile minimal

    - uses: Swatinem/rust-cache@v2.9.2

    - name: Test
      run: cargo test --workspace

  wasm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install Rust Toolchain
      run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown

    - uses: Swatinem/rust-cache@v2.9.2

    - name: Install wasm-bindgen Test Runner
      run: |
        version=$(cargo pkgid --package wasm-bindgen | sed 's/.*@//')
        cargo install wasm-bindgen-cli --version "$version" --locked

    - name: Clippy
      run: cargo clippy --package filepack-wasm --all-targets --target wasm32-unknown-unknown

    - name: Test
      env:
        CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      run: cargo test --package filepack-wasm --target wasm32-unknown-unknown
