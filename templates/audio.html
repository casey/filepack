%% let audio = self.audio();
<img src=/artwork/{{ self.fingerprint }}>
<div class=info>
  <div class=title>{{ audio.display_title(self.audio) }}</div>
  <div class=artist>{{ audio.content.artist }}</div>
  <div class=album>{{ audio.content.album }}</div>
</div>
<audio controls src=/media/audio/{{ self.fingerprint }}/item/{{ Ordinal(self.audio) }}></audio>
