[global]
disable = [
  "existing-relative-links",
  "fenced-code-language",
  "first-line-heading",
  "no-empty-sections",
  "no-inline-html",
]
exclude = ["CHANGELOG.md", "book/src/SUMMARY.md", "crates/generate/templates"]

[code-block-style]
style = "fenced"

[code-fence-style]
style = "backtick"

[emphasis-style]
style = "asterisk"

[heading-style]
style = "setext_with_atx"

[hr-style]
style = "---"

[line-length]
code-blocks = false
line-length = 79
reflow = true
reflow-mode = "normalize"

[list-item-spacing]
style = "loose"

[ol-prefix]
style = "ordered"

[strong-style]
style = "asterisk"

[table-pipe-style]
style = "leading_and_trailing"

[ul-style]
style = "dash"
