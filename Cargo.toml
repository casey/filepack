[package]
name = "filepack"
version = "0.0.12"
autotests = false
categories = ["command-line-utilities", "cryptography", "multimedia"]
description = "content-addressed packages"
keywords = ["media", "packaging", "verification"]
include = [
  "/CHANGELOG.md",
  "/CONTRIBUTING",
  "/LICENSE",
  "/README.md",
  "/completions",
  "/filepack.magic",
  "/src",
  "/static",
  "/templates",
  "/tests",
]

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[workspace]
members = [".", "crates/*"]

[workspace.package]
authors = ["Casey Rodarmor <casey@rodarmor.com>"]
edition = "2024"
homepage = "https://filepack.com"
license = "CC0-1.0"
repository = "https://github.com/casey/filepack"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false }
boilerplate = { version = "1.2.0", features = ["axum"] }
camino = { version = "1.1.9", features = ["serde1"] }
strum = { version = "0.28.0", features = ["derive"] }
usized = "0.0.2"

[dependencies]
axum-extra = { version = "0.12.6", features = ["typed-header"] }
axum-server = { version = "0.8.0", optional = true }
axum = { workspace = true, features = ["form", "json", "matched-path", "original-uri", "query", "tower-log", "tracing"] }
blake3 = { version = "1.5.4", features = ["serde"] }
boilerplate.workspace = true
camino.workspace = true
clap = { version = "4.5.16", features = ["derive", "env", "wrap_help"], optional = true }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"], optional = true }
clap_mangen = { version = "0.3.3", optional = true }
claxon = "0.4.3"
ctrlc = { version = "3.5.2", features = ["termination"], optional = true }
dirs = { version = "7.0.0", optional = true }
ed25519-dalek = { version = "3.0.0", features = ["alloc", "rand_core"] }
filepack-derive = { version = "0.0.2", path = "crates/filepack-derive" }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
humansize = { version = "2.1.3", default-features = false }
hyper-util = { version = "0.1.20", features = ["tokio"], optional = true }
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
id3 = "1.17.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
indicatif = { version = "0.18.0", optional = true }
lexiclean = "0.0.2"
matroska-demuxer = "0.8.0"
mime = "0.3.17"
mime_guess = "2.0.5"
num-traits = "0.2.19"
owo-colors = "4.0.0"
percent-encoding = "2.3.2"
png = "0.18.1"
rand = "0.10.2"
redb = { version = "4.1.0", optional = true }
regex = "1.10.6"
roxmltree = "0.21.1"
rust-embed = { version = "8.11.0", features = ["mime-guess"], optional = true }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
serde_with = { version = "3.11.0", features = ["hex"] }
serde_yaml = "0.9.34"
snafu = "0.9.2"
strum.workspace = true
tempfile = { version = "3.24.0", optional = true }
tokio = { version = "1.52.3", features = ["io-util", "macros"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
unicase = "2.9.0"
unindent = "0.2.4"
url = "2.5.8"
usized.workspace = true
walkdir = { version = "2.5.0", optional = true }
zune-jpeg = "0.5.15"

[dependencies.reqwest]
version = "0.13.3"
default-features = false
features = ["blocking", "charset", "http2", "rustls-no-provider", "system-proxy"]
optional = true

[dependencies.rustls]
version = "0.23.40"
default-features = false
features = ["logging", "ring", "std", "tls12"]
optional = true

[dependencies.rustls-acme]
version = "0.15.2"
default-features = false
features = ["axum", "ring", "tls12", "webpki-roots"]
optional = true

[features]
default = ["client", "fs", "server"]
client = ["dep:reqwest", "dep:rustls", "fs"]
fs = [
  "dep:clap",
  "dep:clap_complete",
  "dep:clap_mangen",
  "dep:dirs",
  "dep:indicatif",
  "dep:tempfile",
  "dep:tracing-journald",
  "dep:tracing-subscriber",
  "dep:walkdir",
]
redb = ["dep:redb"]
server = [
  "axum/default",
  "dep:axum-server",
  "dep:ctrlc",
  "dep:hyper-util",
  "dep:rust-embed",
  "dep:rustls",
  "dep:rustls-acme",
  "fs",
  "redb",
  "tokio/fs",
  "tokio/rt-multi-thread",
]

[dev-dependencies]
pretty_assertions = "1.4.1"
tower = { version = "0.5.3", features = ["util"] }

[lib]
doctest = false

[[bin]]
name = "filepack"
required-features = ["fs"]
test = false

[lints]
workspace = true

[profile.dev.package]
fdeflate.opt-level = 3
image.opt-level = 3
miniz_oxide.opt-level = 3
png.opt-level = 3
zune-core.opt-level = 3
zune-jpeg.opt-level = 3

[profile.release]
codegen-units = 1
lto = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
arbitrary_source_item_ordering = "deny"
assert_is_empty = "allow"
enum_glob_use = "allow"
float_cmp = "allow"
large_enum_variant = "allow"
many_single_char_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
new_without_default = "allow"
pedantic = { level = "deny", priority = -1 }
result_large_err = "allow"
same_functions_in_if_condition = "allow"
self_named_constructors = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
unused_async = "allow"
unused_async_trait_impl = "allow"
wildcard_imports = "allow"

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "allow"
unreachable_pub = "deny"

[[test]]
name = "integration"
path = "tests/lib.rs"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blake3 = { version = "1.5.4", features = ["mmap", "rayon"] }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = { version = "0.3.2", optional = true }

[target."cfg(unix)".dev-dependencies]
libc = "0.2.186"
