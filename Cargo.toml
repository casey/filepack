[package]
name = "filepack"
version = "0.0.11"
autotests = false
categories = ["command-line-utilities", "cryptography", "multimedia"]
description = "content-addressed packages"
keywords = ["media", "packaging", "verification"]
include = ["CHANGELOG.md", "CONTRIBUTING", "LICENSE", "README.md", "filepack.magic", "src", "static", "templates", "tests"]

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[workspace]
members = [".", "crates/*"]

[workspace.package]
authors = ["Casey Rodarmor <casey@rodarmor.com>"]
edition = "2024"
homepage = "https://filepack.com"
license = "CC0-1.0"
repository = "https://github.com/casey/filepack"

[workspace.dependencies]
axum = "0.8.9"
boilerplate = { version = "1.2.0", features = ["axum"] }
camino = { version = "1.1.9", features = ["serde1"] }
strum = { version = "0.28.0", features = ["derive"] }
usized = "0.0.2"

[dependencies]
axum-extra = { version = "0.12.6", features = ["typed-header"] }
axum-server = "0.8.0"
axum.workspace = true
blake3 = { version = "1.5.4", features = ["mmap", "rayon", "serde"] }
boilerplate.workspace = true
camino.workspace = true
clap = { version = "4.5.16", features = ["derive", "env"] }
clap_mangen = "0.3.3"
claxon = "0.4.3"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "7.0.0"
ed25519-dalek = { version = "3.0.0", features = ["alloc", "rand_core"] }
filepack-derive = { version = "0.0.1", path = "crates/filepack-derive" }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
humansize = { version = "2.1.3", default-features = false }
hyper-util = { version = "0.1.20", features = ["tokio"] }
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
id3 = "1.17.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
indicatif = "0.18.0"
lexiclean = "0.0.2"
matroska-demuxer = "0.8.0"
mime = "0.3.17"
mime_guess = "2.0.5"
num-traits = "0.2.19"
owo-colors = "4.0.0"
percent-encoding = "2.3.2"
png = "0.18.1"
rand = "0.10.2"
redb = "4.1.0"
regex = "1.10.6"
roxmltree = "0.21.1"
rust-embed = { version = "8.11.0", features = ["mime-guess"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.127"
serde_with = { version = "3.11.0", features = ["hex"] }
serde_yaml = "0.9.34"
snafu = "0.9.2"
strum.workspace = true
tempfile = "3.24.0"
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.7.1", features = ["set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicase = "2.9.0"
url = "2.5.8"
usized.workspace = true
walkdir = "2.5.0"
zune-jpeg = "0.5.15"

[dependencies.reqwest]
version = "0.13.3"
default-features = false
features = ["blocking", "charset", "http2", "rustls-no-provider", "system-proxy"]

[dependencies.rustls]
version = "0.23.40"
default-features = false
features = ["logging", "ring", "std", "tls12"]

[dependencies.rustls-acme]
version = "0.15.2"
default-features = false
features = ["axum", "ring", "tls12", "webpki-roots"]

[dev-dependencies]
pretty_assertions = "1.4.1"
tower = { version = "0.5.3", features = ["util"] }
unindent = "0.2.4"

[lib]
doctest = false

[[bin]]
name = "filepack"
test = false

[lints]
workspace = true

[profile.dev.package]
fdeflate.opt-level = 3
image.opt-level = 3
miniz_oxide.opt-level = 3
png.opt-level = 3
zune-core.opt-level = 3
zune-jpeg.opt-level = 3

[profile.release]
codegen-units = 1
lto = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
arbitrary_source_item_ordering = "deny"
assert_is_empty = "allow"
enum_glob_use = "allow"
float_cmp = "allow"
large_enum_variant = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
new_without_default = "allow"
pedantic = { level = "deny", priority = -1 }
result_large_err = "allow"
same_functions_in_if_condition = "allow"
self_named_constructors = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
too_many_lines = "allow"
unused_async = "allow"
wildcard_imports = "allow"

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "allow"
unreachable_pub = "deny"

[[test]]
name = "integration"
path = "tests/lib.rs"

[target."cfg(windows)".dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3.2"

[target."cfg(unix)".dev-dependencies]
libc = "0.2.186"
