[package]
name = "filepack-wasm"
version = "0.0.0"
description = "WebAssembly bindings for filepack's byte-level core"
publish = false

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
filepack = { path = "../..", default-features = false }
serde_json = "1.0.127"
wasm-bindgen = "0.2.130"

[dev-dependencies]
js-sys = "0.3.107"
wasm-bindgen-test = "0.3"

[lints]
workspace = true
